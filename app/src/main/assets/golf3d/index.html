<!doctype html>
<!--
  Mini Golf's 3D view, shown in a WebView by ui/screens/Golf3D.kt. It only draws and takes
  your touches: the app works out every shot (game/golf/Golf.kt) and sends the frames here.
  three.min.js is three.js r128 (MIT licence, see its header).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; width: 100%; height: 100%; min-height: 100vh; overflow: hidden; background: #bfe6ff; font-family: sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* The view fills the window, whatever height the page's own content would give it. */
  canvas { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; touch-action: none; }
  .toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: rgba(20,30,24,.78); color: #fff; font-weight: 800; font-size: 20px; padding: 6px 18px; border-radius: 14px; pointer-events: none; white-space: nowrap; }
  .hint { position: fixed; left: 0; right: 70px; bottom: 10px; text-align: center; color: #fff; font-weight: 700; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  .slider { position: fixed; right: 12px; top: 14%; bottom: 14%; width: 48px; border-radius: 24px; border: 2px solid rgba(255,255,255,.85); background: rgba(20,30,24,.45); overflow: hidden; touch-action: none; transition: opacity .3s; }
  .slider.off { opacity: .3; }
  .slider .zone { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .slider .jump { top: 0; height: 45%; background: rgba(255,138,61,.45); }
  .slider .roll { bottom: 0; height: 55%; background: rgba(62,155,79,.45); border-top: 2px dashed rgba(255,255,255,.8); }
  .slider .zone span { writing-mode: vertical-rl; transform: rotate(180deg); font: 700 11px sans-serif; letter-spacing: .12em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .slider .knob { position: absolute; left: 4px; width: 36px; height: 36px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); bottom: 4px; pointer-events: none; }
  .power { position: fixed; right: 70px; top: 50%; transform: translateY(-50%); background: rgba(20,30,24,.78); color: #fff; font-weight: 800; font-size: 16px; padding: 4px 12px; border-radius: 12px; pointer-events: none; }
  .nogl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #1e2a3a; font-weight: 700; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="toast" id="toast" hidden></div>
<div class="power" id="power" hidden></div>
<div class="hint" id="hint"></div>
<div class="slider off" id="slider" role="slider" aria-label="Shot strength: slide up and let go to shoot" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="zone jump"><span>JUMP</span></div>
  <div class="zone roll"><span>ROLL</span></div>
  <div class="knob" id="knob"></div>
</div>
<script>
  // First of all: anything that goes wrong in the scripts below (even one that can't start) is
  // told to the app, which shows it, instead of leaving an empty sky.
  window.addEventListener('error', function (e) {
    try { window.Android.event('error ' + (e.message || 'unknown') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0) + ')'); } catch (x) { /* not in the app */ }
  });
</script>
<script src="three.min.js"></script>
<script src="kylian.js"></script>
<script src="golf3d.js"></script>
</body>
</html>
