<!doctype html>
<!--
  Ship Battle's 3D Fleet skin: one sea, shown in a WebView by ui/screens/Ships3D.kt. It only
  draws and takes your touches: the app keeps the game and sends what this sea shows.
  three.js is the copy Mini Golf uses (../golf3d/three.min.js, r128, MIT licence).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #86c3e6; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="view" aria-label="The sea, in 3D"></canvas>
<script>
  // Anything that goes wrong below is told to the app, which shows it instead of an empty sea.
  window.addEventListener('error', function (e) {
    try { window.Android.event('error ' + (e.message || 'unknown') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0) + ')'); } catch (x) { /* not in the app */ }
  });
</script>
<script src="../golf3d/three.min.js"></script>
<script src="ships3d.js"></script>
</body>
</html>
